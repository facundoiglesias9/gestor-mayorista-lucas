name: Chequeo de tipos

# Compila el proyecto con TypeScript en cada push y PR: si algo no cierra (una funcion llamada
# con argumentos de menos, un campo mal escrito), avisa aca antes de que llegue a Vercel.
on:
  push:
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
