name: Verificar webhook del bot

# Cada 30 minutos le pregunta a la app si el webhook de Telegram sigue bien configurado. Si se
# cayo (nos paso una vez, sin avisar en ningun lado), lo repone solo y avisa por Telegram + Logs.
# De paso borra registros internos viejos (updates ya procesados, logs de mas de 90 dias).
# Necesita el secret CRON_SECRET configurado en este repo (Settings -> Secrets and variables ->
# Actions), con el mismo valor que la variable de entorno CRON_SECRET en Vercel.
#
# OJO: GitHub no garantiza el horario. Con "*/30" (en punto y y media, las horas de mas carga)
# descartaba casi todas las corridas: en la practica corria cada 4 a 7 horas. Por eso va en
# minutos sueltos (17 y 47), y el llamado principal conviene hacerlo desde cron-job.org (gratis
# y puntual, ver README, "Chequeo automatico"). Esto queda de respaldo.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch: {}

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Chequear y reparar el webhook si hace falta
        run: |
          curl -fsS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://gestor-mayorista-lucas.vercel.app/api/cron/verificar-webhook"
